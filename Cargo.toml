[package]
name = "matmul"
version = "1.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Matrix multiplication benchmark suite: Rust and C CPU kernels checked against a naive reference and BLIS"
repository = "https://github.com/moe-a-m/matmul"
keywords = ["matrix", "multiplication", "benchmark", "performance", "blas"]
categories = ["algorithms", "mathematics", "science"]
readme = "README.md"

[features]
default = []
# BLIS-style 6x16 AVX2/FMA kernel in C with OpenMP (x86-64 only). Formerly named `gpu`.
avx2 = []
# Link the system BLIS library and benchmark its cblas_sgemm as a reference.
blis = []

[dependencies]
clap = { version = "4.5.54", features = ["derive"] }
rayon = "1.11.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

[build-dependencies]
cc = "1.2"
